# Netlify Configuration for HoneyTrace Cyber Dashboard

[build]
  base = "dashboard"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Reverse Proxy for HoneyTrace Go Backend API on AWS EC2
# Prevents Mixed-Content (HTTPS -> HTTP) and CORS blocking on public visitors
[[redirects]]
  from = "/api/*"
  to = "http://13.234.121.199:8080/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) Client-Side Route Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
